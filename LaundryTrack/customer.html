<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LaundryTrack - Customer</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- TAILWIND (preflight off) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } };
    </script>

    <style>
      /* ... SEMUA CSS KAMU TETAP SAMA ... */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #e0f2fe, #bae6fd);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .bubble {
        position: fixed;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        pointer-events: none;
      }
      .b1 {
        width: 100px;
        height: 100px;
        top: -30px;
        left: 15%;
      }
      .b2 {
        width: 140px;
        height: 140px;
        right: -50px;
        bottom: 30px;
      }
      .b3 {
        width: 70px;
        height: 70px;
        left: 5%;
        bottom: 10%;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 20px 50px rgba(14, 116, 144, 0.15);
        position: relative;
        z-index: 2;
      }
      .header-logo {
        text-align: center;
        margin-bottom: 10px;
      }
      .header-logo i {
        font-size: 45px;
        color: #0ea5e9;
      }
      .card h1 {
        text-align: center;
        color: #0f172a;
        margin-bottom: 5px;
      }
      .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 25px;
      }
      .input-group {
        position: relative;
        margin-bottom: 15px;
      }
      .input-group i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
      }
      .input-group input {
        width: 100%;
        padding: 14px 15px 14px 45px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        outline: none;
      }
      .input-group input:focus {
        border-color: #0ea5e9;
      }
      .btn-search,
      .btn-order {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px;
        background: #0ea5e9;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-search:hover,
      .btn-order:hover {
        background: #0284c7;
      }
      .customer-order-form {
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid #e2e8f0;
      }
      .customer-order-form h2 {
        font-size: 1.1rem;
        color: #0f172a;
        margin-bottom: 5px;
      }
      .customer-order-form > p {
        color: #64748b;
        font-size: 0.8rem;
        margin-bottom: 18px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 6px;
      }
      .field input,
      .field textarea,
      .field select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        outline: none;
        background: white;
      }
      .field textarea {
        min-height: 80px;
        resize: vertical;
      }
      .field input:focus,
      .field textarea:focus,
      .field select:focus {
        border-color: #0ea5e9;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .price-info {
        background: #f0f9ff;
        color: #0369a1;
        padding: 12px;
        border-radius: 10px;
        font-size: 0.78rem;
        margin-bottom: 15px;
      }
      .order-success {
        display: none;
        margin-top: 15px;
        padding: 13px;
        border-radius: 10px;
        background: #ecfdf5;
        color: #047857;
        font-size: 0.8rem;
      }
      .result-container {
        display: none;
        margin-top: 30px;
      }
      .customer-info {
        background: #f8fafc;
        border-left: 4px solid #0ea5e9;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      .customer-info h3 {
        color: #0f172a;
        font-size: 1rem;
      }
      .customer-info p {
        color: #64748b;
        font-size: 0.75rem;
        margin-top: 4px;
      }
      .timeline {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        position: relative;
        margin: 25px 0;
      }
      .step {
        text-align: center;
        position: relative;
        z-index: 2;
      }
      .step .icon-box {
        width: 38px;
        height: 38px;
        margin: 0 auto 7px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e2e8f0;
        color: #94a3b8;
      }
      .step p {
        font-size: 0.65rem;
        color: #94a3b8;
        font-weight: 600;
      }
      .step.done .icon-box,
      .step.active .icon-box {
        background: #0ea5e9;
        color: white;
      }
      .step.done p,
      .step.active p {
        color: #0284c7;
      }
      .status-msg {
        background: #ecfdf5;
        color: #047857;
        padding: 11px;
        border-radius: 9px;
        text-align: center;
        font-size: 0.8rem;
        margin-bottom: 15px;
      }
      .order-detail {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .detail-box {
        background: #f8fafc;
        border-radius: 10px;
        padding: 12px;
      }
      .detail-box span {
        display: block;
        color: #94a3b8;
        font-size: 0.68rem;
        margin-bottom: 4px;
      }
      .detail-box strong {
        color: #0f172a;
        font-size: 0.82rem;
      }
      .btn-reset {
        width: 100%;
        border: none;
        background: transparent;
        color: #64748b;
        text-decoration: underline;
        cursor: pointer;
        margin-top: 15px;
      }
      .error-msg {
        color: #dc2626;
        font-size: 0.75rem;
        margin-bottom: 10px;
        display: none;
      }
      @media (max-width: 500px) {
        .card {
          padding: 25px 20px;
        }
        .field-grid,
        .order-detail {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="card">
      <div class="header-logo"><i class="fa-solid fa-water"></i></div>
      <h1>LaundryTrack</h1>
      <p class="subtitle">Pesan dan pantau cucianmu dengan mudah.</p>

      <div id="searchSection">
        <div class="input-group">
          <i class="fa-solid fa-phone"></i>
          <input type="text" id="noHpInput" placeholder="Masukkan nomor HP" />
        </div>
        <div id="errorMsg" class="error-msg"></div>
        <button class="btn-search" onclick="cekStatus()">
          <i class="fa-solid fa-magnifying-glass"></i> Cek Status Cucian
        </button>
      </div>

      <div id="customerOrderForm" class="customer-order-form">
        <h2>Buat Pesanan Baru</h2>
        <p>Berat dan harga akan ditentukan admin setelah pakaian ditimbang.</p>

        <div class="field">
          <label>Nama Pelanggan</label>
          <input id="orderNama" type="text" placeholder="Nama lengkap" />
        </div>
        <div class="field">
          <label>Nomor HP</label>
          <input id="orderHp" type="text" placeholder="08xxxxxxxxxx" />
        </div>
        <div class="field">
          <label>Alamat</label>
          <textarea
            id="orderAlamat"
            placeholder="Alamat penjemputan"
          ></textarea>
        </div>
        <div class="field-grid">
          <div class="field">
            <label>Paket</label>
            <select id="orderPaket">
              <option value="Kilat">Kilat</option>
              <option value="Express">Express</option>
              <option value="Regular" selected>Regular</option>
            </select>
          </div>
          <div class="field">
            <label>Layanan</label>
            <select id="orderLayanan">
              <option value="Komplit">Komplit</option>
              <option value="Biasa" selected>Biasa</option>
              <option value="Setrika">Setrika</option>
            </select>
          </div>
        </div>
        <div class="price-info" id="packageInfo"></div>
        <button class="btn-order" onclick="buatPesananCustomer()">
          <i class="fa-solid fa-paper-plane"></i> Buat Pesanan
        </button>
        <div id="orderSuccess" class="order-success"></div>
      </div>

      <div id="resultSection" class="result-container">
        <div class="customer-info">
          <h3 id="cNama">-</h3>
          <p id="cNota">-</p>
        </div>

        <div id="timeline" class="timeline">
          <div class="step">
            <div class="icon-box"><i class="fa-solid fa-motorcycle"></i></div>
            <p>Jemput</p>
          </div>
          <div class="step">
            <div class="icon-box"><i class="fa-solid fa-soap"></i></div>
            <p>Cuci</p>
          </div>
          <div class="step">
            <div class="icon-box"><i class="fa-solid fa-box"></i></div>
            <p>Siap</p>
          </div>
          <div class="step">
            <div class="icon-box"><i class="fa-solid fa-check"></i></div>
            <p>Selesai</p>
          </div>
        </div>

        <div id="statusMsg" class="status-msg">-</div>
        <div id="customerOrderInfo" class="order-detail"></div>
        <button class="btn-reset" onclick="resetForm()">Cek Nomor Lain</button>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/customer.js"></script>
  </body>
</html>
