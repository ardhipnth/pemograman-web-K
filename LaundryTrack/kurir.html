<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portal Kurir - LaundryTrack</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- TAILWIND (preflight off) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } };
    </script>

    <link rel="stylesheet" href="css/kurir.css" />
  </head>

  <body>
    <!-- =====================================================
         LOGIN SCREEN
    ====================================================== -->
    <div id="loginScreen" class="mobile-app">
      <div class="login-card">
        <i class="fa-solid fa-motorcycle"></i>

        <h2>Portal Kurir</h2>
        <p>Sistem LaundryTrack Terpadu</p>

        <div class="input-group">
          <label for="kurirSelect">PILIH KARYAWAN (KURIR)</label>
          <select id="kurirSelect">
            <option value="" selected disabled>-- Pilih Nama Kurir --</option>
            <option value="KR-01">Budi (ID: KR-01)</option>
            <option value="KR-02">Andi (ID: KR-02)</option>
          </select>
        </div>

        <div class="input-group">
          <label for="pinInput">PIN AKSES</label>
          <input
            type="password"
            id="pinInput"
            placeholder="Masukkan PIN bebas"
            maxlength="4"
            inputmode="numeric"
          />
        </div>

        <button type="button" id="btnMulaiBertugas" class="btn-primary">
          Mulai Bertugas <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p
          id="loginError"
          style="
            display: none;
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
          "
        ></p>
      </div>
    </div>

    <!-- =====================================================
         DASHBOARD SCREEN
    ====================================================== -->
    <div id="dashboardScreen" class="mobile-app" style="display: none">
      <!-- HEADER -->
      <div class="header">
        <div>
          <p class="header-greeting">Selamat bertugas,</p>
          <h2 id="namaKurirText" class="kurir-name">Kurir</h2>
        </div>

        <button type="button" id="btnLogout" class="logout-icon" title="Keluar">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>

      <!-- =================================================
           STATISTIK
      ================================================== -->
      <div class="stats-wrapper">
        <div class="stat-box">
          <div class="stat-icon">
            <i class="fa-solid fa-list-check"></i>
          </div>
          <h3 id="countSisa">0</h3>
          <p>Sisa Tugas</p>
        </div>

        <div class="stat-box">
          <div class="stat-icon" style="background: #dcfce7; color: #16a34a">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <h3 id="countSelesai">0</h3>
          <p>Selesai</p>
        </div>
      </div>

      <!-- =================================================
           FILTER
      ================================================== -->
      <div class="filter-container">
        <button type="button" class="filter-btn active" data-filter="semua">
          Semua
        </button>
        <button type="button" class="filter-btn" data-filter="jemput">
          Penjemputan
        </button>
        <button type="button" class="filter-btn" data-filter="antar">
          Pengantaran
        </button>
      </div>

      <!-- =================================================
           DAFTAR TUGAS
      ================================================== -->
      <div class="task-list" id="taskList"></div>

      <!-- =================================================
           RIWAYAT
      ================================================== -->
      <div id="riwayatSection" style="display: none">
        <div
          class="section-title"
          style="padding: 20px; font-weight: 700; font-size: 18px"
        >
          Riwayat Tugas
        </div>
        <div id="riwayatList" class="task-list"></div>
      </div>

      <!-- =================================================
           AKUN
      ================================================== -->
      <div id="akunSection" style="display: none"></div>

      <!-- =================================================
           BOTTOM NAVIGATION
      ================================================== -->
      <div class="bottom-nav">
        <button type="button" class="nav-item active" data-page="tugas">
          <i class="fa-solid fa-list-check"></i>
          <p>Tugas</p>
        </button>

        <button type="button" class="nav-item" data-page="riwayat">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <p>Riwayat</p>
        </button>

        <button type="button" class="nav-item" data-page="akun">
          <i class="fa-solid fa-user"></i>
          <p>Akun</p>
        </button>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/api.js"></script>
    <script src="js/kurir.js"></script>
  </body>
</html>
